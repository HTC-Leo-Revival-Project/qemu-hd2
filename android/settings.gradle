/*
 * HTC HD2 (QEMU machine "htcleo") as an Android app.
 *
 * No AndroidX and no Material: the app is plain framework Java on
 * @android:style/Theme.Holo, the way an Android app was supposed to look.
 */
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = "HTC HD2"
include ':app'
