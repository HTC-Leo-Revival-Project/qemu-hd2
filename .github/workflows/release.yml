# Build the emulator, the web UI and the NAND images and put them in a release.
# on: workflow_dispatch (run it by hand) or a v* tag (a release build)
name: release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'release tag (default: the current commit)'
        required: false
        default: ''
      rom_url:
        description: 'NAND ROM zip (default: the NexusHD2 ICS CM9 from HTC-HD7-Internals)'
        required: false
        default: ''
      clk_url:
        description: 'cLK LEOIMG.nbh or lk.bin (default: cLK.nbh from HTC-HD7-Internals)'
        required: false
        default: ''
      recovery_url:
        description: image for the recovery partition (optional)
        required: false
        default: ''
      upload:
        description: create/update the GitHub release with the assets
        type: boolean
        default: true
  push:
    tags: ['v*']

permissions:
  contents: write   # for the release assets

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180      # a full QEMU plus two NAND images is slow
    steps:
      - uses: actions/checkout@v4

      # The sources are not in this repo: tools/release.sh defaults them to
      # public downloads (ROM, cLK and radio all live in HTC-HD7-Internals).
      # Override per run or with the repository variables ROM_URL / CLK_URL /
      # RECOVERY_URL.
      - name: sources from variables
        run: |
          {
            echo "ROM_URL=${{ inputs.rom_url || vars.ROM_URL }}"
            echo "CLK_URL=${{ inputs.clk_url || vars.CLK_URL }}"
            echo "RECOVERY_URL=${{ inputs.recovery_url || vars.RECOVERY_URL }}"
          } >> "$GITHUB_ENV"

      - name: build and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          ROM_URL: ${{ inputs.rom_url || vars.ROM_URL }}
          CLK_URL: ${{ inputs.clk_url || vars.CLK_URL }}
          RECOVERY_URL: ${{ inputs.recovery_url || vars.RECOVERY_URL }}
          UPLOAD: ${{ (inputs.upload != false && github.event_name == 'workflow_dispatch') && '1' || '' }}
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ninja-build meson pkg-config git ca-certificates \
            python3 python3-pip python3-venv rsync zstd unzip curl ffmpeg \
            libglib2.0-dev libpixman-1-dev libslirp-dev libsdl2-dev \
            libmount-dev libblkid-dev
          # node runs server/index.ts directly, so it needs 22.18 for its own
          # typescript stripping
          curl -fsSL https://deb.nodesource.com/setup_22.x | sudo -E bash -
          sudo apt-get install -y nodejs
          node --version
          # the build wants libslirp >= 4.7 only with CFI, which is off, but
          # keep the version printout for the log
          pkg-config --modversion libslirp
          tools/release.sh --upload

      - name: what was built
        run: ls -la build/release

      - uses: actions/upload-artifact@v4
        with:
          name: htcleo-build
          path: build/release
          retention-days: 14